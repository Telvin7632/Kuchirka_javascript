<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Демонстрація сортування JS-бібліотеки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      color: #333;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Демонстрація роботи JS-бібліотеки сортування</h1>
  
  <h2>Нерозріджений масив (не менше 100 елементів)</h2>
  <div id="nonSparseResult"></div>
  
  <h2>Розріджений масив (з undefined-елементами, не менше 100 елементів)</h2>
  <div id="sparseResult"></div>

  <script src="sortingLibrary.js"></script>
  <script>
    function generateNonSparseArray() {
      const arr = [];
      for (let i = 0; i < 100; i++) {
        arr.push(Math.floor(Math.random() * 1000));
      }
      return arr;
    }

    function generateSparseArray() {
      const arr = new Array(100);
      for (let i = 0; i < 100; i++) {
        if (i % 3 !== 0) {
          arr[i] = Math.floor(Math.random() * 1000);
        }
      }
      return arr;
    }

    function testSorting(arr, containerId, description) {
      const container = document.getElementById(containerId);
      container.innerHTML += `<h3>${description}</h3>`;
      container.innerHTML += `<p>Оригінальний масив: ${JSON.stringify(arr)}</p>`;

      const methods = [
        {name: "BubbleSort", func: SortingLibrary.bubbleSort},
        {name: "SelectionSort", func: SortingLibrary.selectionSort},
        {name: "InsertionSort", func: SortingLibrary.insertionSort},
        {name: "ShellSort", func: SortingLibrary.shellSort},
        {name: "QuickSort", func: SortingLibrary.quickSort}
      ];

      methods.forEach(method => {
        const sorted = method.func.bind(SortingLibrary)(arr, "asc");
        container.innerHTML += `<p><strong>${method.name} (за зростанням):</strong> ${JSON.stringify(sorted)}</p>`;
      });
    }

    const nonSparseArray = generateNonSparseArray();
    testSorting(nonSparseArray, "nonSparseResult", "Нерозріджений масив");

    const sparseArray = generateSparseArray();
    testSorting(sparseArray, "sparseResult", "Розріджений масив");
  </script>
</body>
</html>
