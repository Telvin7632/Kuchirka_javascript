<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №4: Розробка бібліотек у JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { margin-bottom: 0.5em; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Демонстрація роботи бібліотеки сортування</h1>
  <p>Відкрийте консоль браузера (F12), щоб побачити логи виконання.</p>

  <script src="sortLib.js"></script>
  <script>
    const arr = Array.from({length: 100}, () => Math.floor(Math.random() * 1000));
    console.log('⭐ Нерозріджений масив:', arr.slice());

    sortLib.exchangeSort(arr.slice(), true);
    sortLib.selectionSort(arr.slice(), true);
    sortLib.insertionSort(arr.slice(), true);
    sortLib.shellSort(arr.slice(), true);
    sortLib.quickSort(arr.slice(), true);

    const sparse = arr.slice();
    sparse[10] = undefined;
    sparse[50] = undefined;
    console.log('⭐ Розріджений масив:', sparse);

    sortLib.exchangeSort(sparse.slice(), false);
    sortLib.selectionSort(sparse.slice(), false);
    sortLib.insertionSort(sparse.slice(), false);
    sortLib.shellSort(sparse.slice(), false);
    sortLib.quickSort(sparse.slice(), false);
  </script>
</body>
</html>
