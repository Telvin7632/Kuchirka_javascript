<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lights Out</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>Lights Out</h1>
    <button id="start-button" class="btn">Розпочати гру</button>
  </div>

  <div id="game" class="hidden">
    <header>
      <h1>Lights Out</h1>
    </header>
    <section id="controls">
      <button id="new-game" class="btn">Нова гра</button>
      <button id="restart" class="btn">Рестарт</button>
      <div class="stat">Ходи: <span id="move-count">0</span></div>
      <div class="stat">Мін. ходів: <span id="min-moves">0</span></div>
      <div class="stat">Час: <span id="timer">00:00</span></div>
    </section>
    <div id="grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
