<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторна 8</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav">
    <div id="hamburger">&#9776;</div>
    <ul id="menu">
      <li><img src="icon1.png" alt=""> Головна</li>
      <li><img src="icon2.png" alt=""> Про нас</li>
      <li><img src="icon3.png" alt=""> Послуги</li>
      <li><img src="icon4.png" alt=""> Контакти</li>
    </ul>
  </nav>

  <div class="carousel">
    <div class="slides-wrapper">
      <div class="slides">
        <div class="slide"><img src="https://placehold.co/600x300?text=Slide+1" alt="Slide 1"></div>
        <div class="slide"><img src="https://placehold.co/600x300?text=Slide+2" alt="Slide 2"></div>
        <div class="slide"><img src="https://placehold.co/600x300?text=Slide+3" alt="Slide 3"></div>
        <div class="slide"><img src="https://placehold.co/600x300?text=Slide+4" alt="Slide 4"></div>
      </div>
    </div>
    <button id="prev">&#10094;</button>
    <button id="next">&#10095;</button>
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="large-only">
    <img src="https://placehold.co/400x300?text=Large+Image+1" alt="Large 1">
    <img src="https://placehold.co/400x300?text=Large+Image+2" alt="Large 2">
    <img src="https://placehold.co/400x300?text=Large+Image+3" alt="Large 3">
  </div>

  <div class="medium-only">
    <img src="https://placehold.co/300x200?text=Medium+Image+1" alt="Medium 1">
    <img src="https://placehold.co/300x200?text=Medium+Image+2" alt="Medium 2">
    <img src="https://placehold.co/300x200?text=Medium+Image+3" alt="Medium 3">
  </div>

  <script src="script.js"></script>
</body>
</html>
